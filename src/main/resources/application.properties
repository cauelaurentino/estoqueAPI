spring.application.name=EstoqueSAEP

# Define cores no terminal
spring.output.ansi.enabled=always

# Define path raiz do endpoint
# ATEN\u00c7\u00c3O: Suas chamadas no Postman devem incluir /estoque na URL!
server.servlet.context-path=/estoque

# For\u00e7a a ativa\u00e7\u00e3o do perfil 'prod' para usar o MySQL do Docker
spring.profiles.active=${APP_ENVIRONMENT:test}

# Define a porta 8081 como padr\u00e3o para evitar conflito com a 8080
server.port=${SERVER_PORT:8080}